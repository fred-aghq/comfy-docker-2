# Build args shared by every instance. Merged into each service's build.args
# with `<<: *common-build-args`, then extended with per-instance versions.
x-common-build-args: &common-build-args
  USER_ID: ${UID}
  GROUP_ID: ${GID}
  USERNAME: ${USERNAME}
  TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST:-}

# Runtime configuration shared by every instance. Merged into each service with
# `<<: *comfyui-base`. Note that YAML merge keys replace whole keys rather than
# deep-merging, so anything a service overrides (build, volumes, ports) is
# specified in full by that service.
x-comfyui-base: &comfyui-base
  user: "${UID}:${GID}"
  working_dir: /ComfyUI
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: [gpu]
  restart: unless-stopped
  networks:
    internal:

services:
  comfyui-default:
    <<: *comfyui-base
    profiles: ["default"]
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
      args:
        <<: *common-build-args
        CUDA_BASE_IMAGE: nvidia/cuda:13.0.3-cudnn-devel-ubuntu24.04
        CUDA_RUNTIME_IMAGE: nvidia/cuda:13.0.3-cudnn-runtime-ubuntu24.04
        PYTHON_VERSION: 3.14.4
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
        COMFYUI_REF: master
    env_file:
      - ./instances/default/instance.env
    volumes:
      - ${MODELS_HOST_PATH:-./data/models}:/ComfyUI/models
      - ./data/default/custom_nodes:/ComfyUI/custom_nodes
      - ./data/default/input:/ComfyUI/input
      - ./data/default/output:/ComfyUI/output
      - ./data/default/user:/ComfyUI/user
    ports:
      - "8188:8188"
  comfyui-legacy:
    <<: *comfyui-base
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
      args:
        <<: *common-build-args
        CUDA_BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        CUDA_RUNTIME_IMAGE: nvidia/cuda:12.8.1-cudnn-runtime-ubuntu22.04
        PYTHON_VERSION: 3.12.3
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
        COMFYUI_REF: master
    env_file:
      - ./instances/legacy/instance.env
    volumes:
      - ${MODELS_HOST_PATH:-./data/models}:/ComfyUI/models
      - ./data/legacy/custom_nodes:/ComfyUI/custom_nodes
      - ./data/legacy/input:/ComfyUI/input
      - ./data/legacy/output:/ComfyUI/output
      - ./data/legacy/user:/ComfyUI/user
    ports:
      - "8189:8188"
networks:
  internal:
