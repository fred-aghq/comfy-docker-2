# Build args shared by every instance. Merged into each service's build.args
# with `<<: *common-build-args`, then extended with per-instance versions.
x-common-build-args: &common-build-args
  USER_ID: ${UID}
  GROUP_ID: ${GID}
  USERNAME: ${USERNAME}

# Runtime configuration shared by every instance. Merged into each service with
# `<<: *comfyui-base`. Note that YAML merge keys replace whole keys rather than
# deep-merging, so anything a service overrides (build, volumes, ports) is
# specified in full by that service.
x-comfyui-base: &comfyui-base
  user: "${UID}:${GID}"
  working_dir: /ComfyUI
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: [gpu]
  restart: unless-stopped
  networks:
    internal:

services:
  comfyui-default:
    <<: *comfyui-base
    profiles: ["default"]
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
      args:
        <<: *common-build-args
        CUDA_BASE_IMAGE: nvidia/cuda:13.0.3-cudnn-devel-ubuntu24.04
        PYTHON_VERSION: 3.14.4
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    env_file:
      - ./instances/default/instance.env
    volumes:
      - ./ComfyUI:/ComfyUI
      - default-home-data:/home/${USERNAME}
      - default-temp-data:/temp-data
      - ${MODELS_HOST_PATH:-./ComfyUI/models}:/ComfyUI/models
    ports:
      - "8188:8188"
  comfyui-legacy:
    <<: *comfyui-base
    profiles: ["legacy"]
    build:
      context: .
      dockerfile: ./.docker/Dockerfile
      args:
        <<: *common-build-args
        CUDA_BASE_IMAGE: nvidia/cuda:12.8.1-cudnn-devel-ubuntu22.04
        PYTHON_VERSION: 3.12.3
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cu128
    env_file:
      - ./instances/legacy/instance.env
    volumes:
      - ./ComfyUI-legacy:/ComfyUI
      - legacy-home-data:/home/${USERNAME}
      - legacy-temp-data:/temp-data
      - ${MODELS_HOST_PATH:-./ComfyUI/models}:/ComfyUI/models
    ports:
      - "8189:8188"
networks:
  internal:
volumes:
  default-temp-data:
  default-home-data:
  legacy-temp-data:
  legacy-home-data:
